<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音效知识库</title>
  <link rel="icon" href="data:,">
  <style>
    :root {
      --ink: #161819;
      --muted: #68716f;
      --paper: #f6f3ec;
      --panel: #fffdf8;
      --line: rgba(22, 24, 25, 0.12);
      --teal: #0f8b8d;
      --red: #d94f3d;
      --gold: #d99b24;
      --green: #2f9c68;
      --blue: #4267b2;
      --violet: #6b5fc7;
      --shadow: 0 20px 50px rgba(22, 24, 25, 0.12);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: Inter, "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      line-height: 1.6;
    }
    button, input { font: inherit; }
    button { color: inherit; }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      padding: 16px clamp(16px, 4vw, 52px);
      border-bottom: 1px solid var(--line);
      background: rgba(246, 243, 236, 0.88);
      backdrop-filter: blur(16px);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      color: #fff;
      background: var(--ink);
      font-weight: 900;
    }
    .brand-text strong {
      display: block;
      font-size: 18px;
      line-height: 1.1;
    }
    .brand-text span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }
    .header-stats {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .stat-pill {
      padding: 6px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
    }

    .hero {
      padding: 54px clamp(16px, 4vw, 52px) 24px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(15, 139, 141, 0.13), rgba(217, 79, 61, 0.08) 48%, rgba(217, 155, 36, 0.16)),
        var(--paper);
    }
    .hero-inner {
      max-width: 1180px;
      margin: 0 auto;
    }
    h1 {
      margin: 0;
      max-width: 980px;
      font-size: clamp(36px, 6vw, 76px);
      line-height: 0.98;
      letter-spacing: 0;
    }
    .hero p {
      max-width: 820px;
      margin: 18px 0 0;
      color: #27312f;
      font-size: clamp(16px, 2vw, 20px);
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 12px;
      max-width: 1180px;
      margin: 22px auto 0;
    }
    .search {
      min-height: 46px;
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel);
      outline: none;
    }
    .search:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 139, 141, 0.1);
    }
    .select {
      min-height: 46px;
      padding: 10px 34px 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: var(--panel);
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 24px clamp(16px, 4vw, 52px) 54px;
    }
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }
    .tab {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
      font-weight: 800;
      transition: border-color 140ms, background 140ms, transform 140ms;
    }
    .tab:hover {
      transform: translateY(-1px);
      border-color: rgba(15, 139, 141, 0.42);
    }
    .tab.active {
      color: #fff;
      border-color: var(--ink);
      background: var(--ink);
    }
    .tab span {
      color: inherit;
      opacity: 0.72;
      font-size: 12px;
      margin-left: 5px;
    }

    .library-view[hidden], .reader-view[hidden] {
      display: none !important;
    }
    .library-view {
      display: block;
    }
    .reader-view {
      min-height: 100dvh;
      background: var(--paper);
    }
    .reader-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 12px clamp(14px, 4vw, 40px);
      border-bottom: 1px solid var(--line);
      background: rgba(246, 243, 236, 0.94);
      backdrop-filter: blur(16px);
    }
    .reader-back {
      min-height: 44px;
      padding: 9px 13px;
      border: 1px solid var(--ink);
      border-radius: 8px;
      color: #fff;
      background: var(--ink);
      cursor: pointer;
      font-weight: 900;
    }
    .reader-hint {
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    body.reader-open .site-header,
    body.reader-open .hero {
      display: none;
    }
    body.reader-open main {
      max-width: none;
      padding: 0;
    }
    .results-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }
    .category-note {
      color: var(--muted);
      font-weight: 600;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 12px;
    }
    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      cursor: pointer;
      transition: border-color 140ms, box-shadow 140ms, transform 140ms;
    }
    .card:hover {
      transform: translateY(-2px);
      border-color: rgba(15, 139, 141, 0.42);
      box-shadow: 0 12px 26px rgba(22, 24, 25, 0.11);
    }
    .card.active {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px rgba(15, 139, 141, 0.1);
    }
    .thumb-wrap {
      position: relative;
      aspect-ratio: 16 / 9;
      background: linear-gradient(135deg, #d8d1c4, #f0ece2);
    }
    .thumb-wrap img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .cat-badge {
      position: absolute;
      left: 8px;
      top: 8px;
      padding: 4px 7px;
      border-radius: 6px;
      color: #fff;
      background: rgba(22, 24, 25, 0.76);
      font-size: 12px;
      font-weight: 800;
    }
    .card-body {
      padding: 12px;
    }
    .card-title {
      margin: 0;
      font-size: 15px;
      line-height: 1.35;
      font-weight: 900;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .card-summary {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .detail {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }
    .reader-detail {
      max-width: 1180px;
      margin: 0 auto;
      border: 0;
      border-radius: 0;
      box-shadow: none;
    }
    .reader-detail .detail-body {
      padding: clamp(18px, 4vw, 48px);
    }
    .reader-detail .detail-title {
      max-width: 1040px;
      color: var(--ink);
      font-size: clamp(30px, 5vw, 56px);
      line-height: 1.05;
    }
    .reader-detail .detail-summary {
      max-width: 980px;
      font-size: 16px;
      line-height: 1.85;
    }
    .reader-detail .section {
      margin-top: 34px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
    }
    .reader-detail .section h3 {
      margin-bottom: 12px;
      font-size: 13px;
    }
    .reader-detail .step {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(0, 1fr);
      gap: 18px;
      padding: 20px 0;
      align-items: start;
    }
    .reader-detail .step-shot {
      margin: 0;
    }
    .reader-detail .step strong {
      font-size: 18px;
    }
    .reader-detail .step p {
      font-size: 15px;
      line-height: 1.8;
    }
    .reader-detail .idea,
    .reader-detail .tip,
    .reader-detail .plugin,
    .reader-detail .learning-point {
      padding: 10px 0;
      font-size: 15px;
      line-height: 1.75;
    }
    .detail-cover {
      aspect-ratio: 16 / 9;
      background: #e4e1d9;
    }
    .detail-cover img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }
    .detail-body {
      padding: 16px;
    }
    .detail-title {
      margin: 0;
      color: var(--teal);
      font-size: 22px;
      line-height: 1.25;
    }
    .detail-summary {
      margin: 10px 0 0;
      color: var(--ink);
      font-size: 13px;
      line-height: 1.7;
    }
    .open-video {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 38px;
      margin-top: 12px;
      padding: 8px 12px;
      border: 1px solid var(--ink);
      border-radius: 8px;
      color: #fff;
      background: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
    }
    .section {
      margin-top: 18px;
    }
    .section h3 {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .step {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }
    .step:last-child {
      border-bottom: none;
    }
    .step strong {
      display: block;
      font-size: 13px;
      line-height: 1.4;
    }
    .step p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }
    .step-shot {
      width: 100%;
      margin: 0 0 9px;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #e4e1d9;
      overflow: hidden;
      cursor: zoom-in;
      text-align: left;
    }
    .step-shot img {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background:
        linear-gradient(135deg, rgba(66, 103, 178, 0.12), rgba(50, 142, 120, 0.12)),
        #e4e1d9;
    }
    .step-shot span {
      display: block;
      padding: 6px 8px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.74);
      font-size: 11px;
      font-weight: 800;
    }
    .step-shot.is-loaded span {
      color: var(--green);
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .chip {
      padding: 3px 8px;
      border: 1px solid rgba(66, 103, 178, 0.2);
      border-radius: 999px;
      color: var(--blue);
      background: rgba(66, 103, 178, 0.08);
      font-size: 11px;
      font-weight: 700;
    }
    .idea, .tip, .plugin {
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      font-size: 12px;
      line-height: 1.55;
    }
    .idea:last-child, .tip:last-child, .plugin:last-child { border-bottom: none; }
    .plugin strong {
      display: inline-block;
      color: var(--green);
      margin-bottom: 3px;
    }
    .plugin-settings { margin-top: 6px; }
    .update-note {
      margin-top: 8px;
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
    }
    .plugin-settings { margin-top: 6px; }
    .update-note {
      margin-top: 8px;
      color: var(--red);
      font-size: 12px;
      font-weight: 800;
    }
    .empty {
      padding: 28px;
      border: 1px dashed var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: var(--panel);
    }

    @media (max-width: 980px) {
      .toolbar { grid-template-columns: 1fr; }
      .reader-detail .step { grid-template-columns: 1fr; }
      .reader-detail .detail-body { padding-inline: 16px; }
    }
    @media (max-width: 640px) {
      .site-header { align-items: flex-start; flex-direction: column; }
      .header-stats { justify-content: flex-start; }
      main { padding-inline: 14px; }
      .grid { grid-template-columns: 1fr; }
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      place-items: center;
      padding: 24px;
      background: rgba(10, 11, 12, 0.88);
      overflow: auto;
    }
    .lightbox.open {
      display: grid;
    }
    .lightbox.zoomed {
      place-items: start center;
    }
    .lightbox img {
      max-width: 96vw;
      max-height: 86vh;
      display: block;
      border-radius: 8px;
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.45);
      cursor: zoom-in;
    }
    .lightbox.zoomed img {
      width: auto;
      max-width: none;
      max-height: none;
      cursor: zoom-out;
    }
    .lightbox-close {
      position: fixed;
      top: 14px;
      right: 18px;
      min-height: 36px;
      padding: 8px 12px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      border-radius: 8px;
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
      font-weight: 900;
      cursor: pointer;
    }
    .lightbox-caption {
      position: fixed;
      left: 24px;
      right: 96px;
      bottom: 18px;
      color: rgba(255, 255, 255, 0.86);
      font-size: 13px;
      line-height: 1.5;
      text-shadow: 0 1px 8px rgba(0, 0, 0, 0.65);
    }
  </style>
</head>

    function escapeHtml(value) {
      const map = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      };
      return String(value ?? "").replace(/[&<>"']/g, (char) => map[char]);
    }

    function escapeAttr(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }

    function thumbnail(record, quality = "hqdefault") {
      return "https://i.ytimg.com/vi/" + encodeURIComponent(record.videoId) + "/" + quality + ".jpg";
    }

    function searchable(record) {
      return [
        record.title,
        record.source,
        record.addedAt || "",
        record.updatedAt || "",
        record.updateNote || "",
        categoryById[record.category]?.label || "",
        record.summary,
        record.keywords.join(" "),
        record.materials.join(" "),
        record.coreIdeas.join(" "),
        record.plugins.map((plugin) => [plugin.name, plugin.purpose, ...(plugin.settings || [])].join(" ")).join(" "),
        record.steps.map((step) => [step.name, step.detail, ...(step.params || [])].join(" ")).join(" "),
        (record.chainFocus || []).join(" "),
        (record.parameterLogic || []).join(" "),
        (record.practiceChecklist || []).join(" ")
      ].join(" ").toLowerCase();
    }

    function recordTime(record, field) {
      const value = field === "added" ? record.addedAt : (record.updatedAt || record.addedAt);
      const time = Date.parse(value || "1970-01-01");
      return Number.isNaN(time) ? 0 : time;
    }

    function sortedRecords(list) {
      const collator = new Intl.Collator("zh-CN", { numeric: true, sensitivity: "base" });
      return [...list].sort((a, b) => {
        if (state.sort === "updatedAsc") return recordTime(a) - recordTime(b) || collator.compare(a.title, b.title);
        if (state.sort === "addedDesc") return recordTime(b, "added") - recordTime(a, "added") || collator.compare(a.title, b.title);
        if (state.sort === "titleAsc") return collator.compare(a.title, b.title);
        return recordTime(b) - recordTime(a) || collator.compare(a.title, b.title);
      });
    }

    function filteredRecords() {
      const query = state.query.trim().toLowerCase();
      const list = records.filter((record) => {
        const categoryMatch = state.category === "all" || record.category === state.category || record.secondaryCategories.includes(state.category);
        const sourceMatch = state.source === "all" || record.source === state.source;
        const queryMatch = !query || searchable(record).includes(query);
        return categoryMatch && sourceMatch && queryMatch;
      });
      return sortedRecords(list);
    }

    function renderTabs() {
      tabsEl.innerHTML = categories.map((category) => {
        const count = category.id === "all"
          ? records.length
          : records.filter((record) => record.category === category.id || record.secondaryCategories.includes(category.id)).length;
        return '<button class="tab ' + (state.category === category.id ? 'active' : '') + '" type="button" data-category="' + category.id + '">' +
          escapeHtml(category.label) + '<span>' + count + '</span></button>';
      }).join("");
    }

    function renderGrid() {
      const list = filteredRecords();
      if (!list.some((record) => record.id === state.activeId)) {
        state.activeId = list[0]?.id || "";
      }

      countEl.textContent = "当前显示 " + list.length + " / " + records.length + " 个模块";
      noteEl.textContent = categoryById[state.category]?.description || "";

      if (!list.length) {
        gridEl.innerHTML = '<div class="empty">没有匹配的模块。</div>';
        detailEl.innerHTML = "";
        return;
      }

      gridEl.innerHTML = list.map((record) => {
        const category = categoryById[record.category];
        return '<article class="card ' + (record.id === state.activeId ? 'active' : '') + '" data-id="' + record.id + '">' +
          '<div class="thumb-wrap">' +
            '<img src="' + thumbnail(record) + '" alt="' + escapeAttr(record.title) + '" loading="lazy" decoding="async" fetchpriority="low" onerror="this.style.display=\'none\'">' +
            '<span class="cat-badge">' + escapeHtml(category.label) + '</span>' +
          '</div>' +
          '<div class="card-body">' +
            '<h2 class="card-title">' + escapeHtml(record.title) + '</h2>' +
            '<div class="card-meta"><span>' + escapeHtml(record.source) + '</span><span>' + record.steps.length + ' 步骤</span><span>' + record.plugins.length + ' 处理点</span><span>更新 ' + escapeHtml(record.updatedAt || record.addedAt || "") + '</span></div>' +
            '<p class="card-summary">' + escapeHtml(record.summary) + '</p>' +
          '</div>' +
        '</article>';
      }).join("");
    }

    function showLibrary() {
      state.view = "library";
      document.body.classList.remove("reader-open");
      libraryViewEl.hidden = false;
      readerViewEl.hidden = true;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showReader() {
      state.view = "reader";
      document.body.classList.add("reader-open");
      libraryViewEl.hidden = true;
      readerViewEl.hidden = false;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function imageAsset(kind, key) {
      if (!key) return "";
      if (imageManifest[key] && imageManifest[key][kind]) return imageManifest[key][kind];
      return "assets/shots/" + kind + "/" + encodeURIComponent(key) + ".webp";
    }

    function loadDetailPreviews() {
      detailEl.querySelectorAll("img[data-shot-preview]").forEach((img) => {
        if (img.getAttribute("src")) return;
        const key = img.getAttribute("data-shot-preview");
        const src = imageAsset("preview", key);
        if (!src) return;
        img.decoding = "async";
        img.loading = "lazy";
        img.src = src;
        const button = img.closest(".step-shot");
        if (button) {
          button.classList.add("is-loaded");
          const label = button.querySelector("span");
          if (label) label.textContent = "点击放大查看高清步骤截图";
        }
      });
    }

    window.loadDetailPreviews = loadDetailPreviews;

    function listSection(title, items, className = "learning-point") {
      if (!Array.isArray(items) || !items.length) return "";
      return '<div class="section"><h3>' + escapeHtml(title) + '</h3>' +
        items.map((item) => '<div class="' + className + '">' + escapeHtml(item) + '</div>').join("") +
        '</div>';
    }

    function renderDetail() {
      const record = records.find((item) => item.id === state.activeId);
      if (!record) return;
      const category = categoryById[record.category];
      const stepHtml = record.steps.map((step, index) => {
        const shotHtml = step.imageKey
          ? '<button class="step-shot" type="button" data-step-index="' + index + '" data-image-key="' + escapeAttr(step.imageKey) + '" aria-label="' + escapeAttr("放大步骤截图：" + step.name) + '">' +
              '<img data-shot-preview="' + escapeAttr(step.imageKey) + '" alt="' + escapeAttr(record.title + " - " + step.name) + '" loading="lazy" decoding="async">' +
              '<span>截图准备中，稍后可放大查看</span>' +
            '</button>'
          : '';
        return '<div class="step">' + shotHtml + '<strong>' + step.order + '. ' + escapeHtml(step.name) + '</strong><p>' + escapeHtml(step.detail) + '</p>' +
          (step.params.length ? '<div class="chips">' + step.params.slice(0, 8).map((param) => '<span class="chip">' + escapeHtml(param) + '</span>').join("") + '</div>' : '') +
          '</div>';
      }).join("");
      const chainFocusHtml = listSection("效果链学习重点", record.chainFocus, "learning-point");
      const parameterLogicHtml = listSection("参数调试逻辑", record.parameterLogic, "learning-point");
      const practiceHtml = listSection("练习复盘", record.practiceChecklist, "tip");
      const ideasHtml = record.coreIdeas.map((idea) => '<div class="idea">' + escapeHtml(idea) + '</div>').join("");
      const pluginHtml = record.plugins.map((plugin) => {
        const settings = Array.isArray(plugin.settings) && plugin.settings.length
          ? '<div class="chips plugin-settings">' + plugin.settings.slice(0, 8).map((setting) => '<span class="chip">' + escapeHtml(setting) + '</span>').join("") + '</div>'
          : '';
        return '<div class="plugin"><strong>' + escapeHtml(plugin.name) + '</strong><div>' + escapeHtml(plugin.purpose) + '</div>' + settings + '</div>';
      }).join("");
      const keywordHtml = record.keywords.slice(0, 18).map((keyword) => '<span class="chip">' + escapeHtml(keyword) + '</span>').join("");
      const materialHtml = record.materials.slice(0, 18).map((material) => '<span class="chip">' + escapeHtml(material) + '</span>').join("");
      const tipHtml = record.tips.map((tip) => '<div class="tip">' + escapeHtml(tip) + '</div>').join("");

      detailEl.innerHTML =
        '<div class="detail-cover"><img src="' + thumbnail(record, "hqdefault") + '" alt="' + escapeAttr(record.title) + '" loading="lazy" decoding="async" onerror="this.style.display=\'none\'"></div>' +
        '<div class="detail-body">' +
          '<h2 class="detail-title">' + escapeHtml(record.title) + '</h2>' +
          '<div class="card-meta"><span>' + escapeHtml(category.label) + '</span><span>' + escapeHtml(record.source) + '</span><span>学习 ' + escapeHtml(record.addedAt || "") + '</span><span>更新 ' + escapeHtml(record.updatedAt || record.addedAt || "") + '</span></div>' +
          (record.updateNote ? '<div class="update-note">' + escapeHtml(record.updateNote) + '</div>' : '') +
          '<p class="detail-summary">' + escapeHtml(record.summary) + '</p>' +
          '<a class="open-video" href="' + escapeAttr(record.url) + '" target="_blank" rel="noopener">打开原视频</a>' +
          chainFocusHtml +
          parameterLogicHtml +
          '<div class="section"><h3>制作步骤</h3>' + stepHtml + '</div>' +
          '<div class="section"><h3>核心观点</h3>' + ideasHtml + '</div>' +
          '<div class="section"><h3>插件 / 处理点</h3>' + pluginHtml + '</div>' +
          practiceHtml +
          '<div class="section"><h3>材料</h3><div class="chips">' + materialHtml + '</div></div>' +
          '<div class="section"><h3>关键词</h3><div class="chips">' + keywordHtml + '</div></div>' +
          '<div class="section"><h3>实用技巧</h3>' + tipHtml + '</div>' +
        '</div>';
      loadDetailPreviews();
    }

    function openLightbox(src, caption) {
      lightboxImageEl.src = src;
      lightboxImageEl.alt = caption;
      lightboxCaptionEl.textContent = caption + "。点击图片切换原始尺寸查看细节。";
      lightboxEl.classList.add("open");
      lightboxEl.classList.remove("zoomed");
      lightboxEl.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeLightbox() {
      lightboxEl.classList.remove("open");
      lightboxEl.classList.remove("zoomed");
      lightboxEl.setAttribute("aria-hidden", "true");
      lightboxImageEl.removeAttribute("src");
      document.body.style.overflow = "";
    }

    function render() {
      renderTabs();
      renderGrid();
      renderDetail();
    }

    tabsEl.addEventListener("click", (event) => {
      const button = event.target.closest(".tab");
      if (!button) return;
      state.category = button.dataset.category;
      render();
    });

    gridEl.addEventListener("click", (event) => {
      const card = event.target.closest(".card");
      if (!card) return;
      state.activeId = card.dataset.id;
      renderGrid();
      renderDetail();
      showReader();
    });

    backToLibraryEl.addEventListener("click", () => {
      showLibrary();
      renderGrid();
    });

    detailEl.addEventListener("click", (event) => {
      const target = event.target;
      const shot = target.closest ? target.closest(".step-shot") : null;
      if (!shot) return;
      const record = records.find((item) => item.id === state.activeId);
      if (!record) return;
      const step = record.steps[Number(shot.dataset.stepIndex)];
      if (!step || !step.imageKey) return;
      const src = imageAsset("full", step.imageKey) || imageAsset("preview", step.imageKey);
      if (!src) {
        const label = shot.querySelector("span");
        if (label) label.textContent = "截图还在读取，请稍后再点";
        return;
      }
      openLightbox(src, record.title + " / " + step.order + ". " + step.name);
    });

    lightboxImageEl.addEventListener("click", (event) => {
      event.stopPropagation();
      lightboxEl.classList.toggle("zoomed");
    });

    lightboxEl.addEventListener("click", (event) => {
      if (event.target === lightboxEl) closeLightbox();
    });

    lightboxCloseEl.addEventListener("click", closeLightbox);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && lightboxEl.classList.contains("open")) {
        closeLightbox();
        return;
      }
      if (event.key === "Escape" && state.view === "reader") showLibrary();
    });

    searchEl.addEventListener("input", (event) => {
      state.query = event.target.value;
      render();
    });

    sourceEl.addEventListener("change", (event) => {
      state.source = event.target.value;
      state.activeId = "";
      render();
    });

    sortEl.addEventListener("change", (event) => {
      state.sort = event.target.value;
      state.activeId = "";
      render();
    });

    render();
  </script>
  <script>
if (window.loadDetailPreviews) window.loadDetailPreviews();
  </script>
</body>
</html>
